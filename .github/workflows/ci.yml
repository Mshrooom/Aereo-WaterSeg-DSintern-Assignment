name: SegFormer V3 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/production.in
            requirements/ci.in

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install CPU PyTorch
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.2,<3"

      - name: Install project dependencies
        run: |
          python -m pip install \
            -r requirements/production.in \
            -r requirements/ci.in

          python -m pip install \
            --no-deps \
            --editable .

      - name: Verify critical imports
        run: |
          python -c "import torch; print('torch:', torch.__version__)"
          python -c "import PIL; print('Pillow import passed')"
          python -c "import rasterio; print('rasterio:', rasterio.__version__)"
          python -c "import fastapi; print('fastapi:', fastapi.__version__)"
          python -c "import transformers; print('transformers:', transformers.__version__)"
          python -c "import optuna; print('optuna:', optuna.__version__)"
          python -c "import aereo_water; print('aereo_water:', aereo_water.__file__)"

      - name: Compile source
        run: |
          python -m compileall -q src scripts

      - name: Run tests
        run: |
          python -m pytest -q
