paths:
  dataset_root: /kaggle/input/satellite-images-of-water-bodies/Water Bodies Dataset
  output_dir: /kaggle/working/aereo-water-sam-output

data:
  images_dir_name: Images
  masks_dir_name: Masks
  extensions: [.jpg, .jpeg, .png, .tif, .tiff]
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  stratification_bins: 10
  num_workers: 2
  verify_files: true
  tile_size: 1024
  tile_overlap: 128
  materialize_tiles: false
model:
  model_id: facebook/sam-vit-base
  trainable_parts: mask_decoder
  unfreeze_last_vision_blocks: 0
  multimask_output: false
prompts:
  train_modes: [none, point1, points, box, box_points]
  train_weights: [0.35, 0.15, 0.15, 0.20, 0.15]
  eval_modes: [none, point1, points, box, box_points]
  positive_points: 3
  negative_points: 1
  box_jitter_fraction: 0.08
train:
  seed: 42
  epochs: 12
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  encoder_learning_rate: 0.000001
  weight_decay: 0.0001
  warmup_fraction: 0.08
  max_grad_norm: 1.0
  amp: true
  patience: 4
  num_thresholds: 17
  threshold_min: 0.10
  threshold_max: 0.90
  primary_prompt_mode: none
  monitor_metric: iou
  bce_weight: 0.35
  dice_weight: 0.45
  focal_weight: 0.20
  iou_head_weight: 0.10
tracking:
  provider: local
  project: aereo-water-sam
  entity: ""
  run_name: sam-vit-b-water-full-data
  wandb_mode: offline
  log_images: 8
inference:
  threshold: 0.50
  use_tiling: true
  tile_size: 1024
  tile_overlap: 128
  min_component_area: 0
  fill_holes: false
