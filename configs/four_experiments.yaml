paths:
  dataset_root: /kaggle/input/satellite-images-of-water-bodies/Water Bodies Dataset
  output_dir: /kaggle/working/aereo-water-four-experiments-output

data:
  images_dir_name: Images
  masks_dir_name: Masks
  extensions: [.jpg, .jpeg, .png, .tif, .tiff]
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  stratification_bins: 10
  num_workers: 2
  verify_files: true
  tile_size: 1024
  tile_overlap: 128
  materialize_tiles: false

model:
  model_id: facebook/sam-vit-base
  trainable_parts: mask_decoder
  unfreeze_last_vision_blocks: 0
  multimask_output: false

prompts:
  train_modes: [point1, points, box, box_points]
  train_weights: [0.20, 0.25, 0.25, 0.30]
  eval_modes: [point1, points, box, box_points]
  positive_points: 3
  negative_points: 1
  box_jitter_fraction: 0.08

train:
  seed: 42
  epochs: 8
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  encoder_learning_rate: 0.000001
  weight_decay: 0.0001
  warmup_fraction: 0.08
  max_grad_norm: 1.0
  amp: true
  patience: 3
  num_thresholds: 17
  threshold_min: 0.10
  threshold_max: 0.90
  primary_prompt_mode: box_points
  monitor_metric: iou
  bce_weight: 0.35
  dice_weight: 0.45
  focal_weight: 0.20
  iou_head_weight: 0.10
  resume_checkpoint: ""

semantic:
  model_id: nvidia/segformer-b0-finetuned-ade-512-512
  image_size: 512
  epochs: 12
  batch_size: 8
  learning_rate: 0.00006
  weight_decay: 0.0001
  patience: 4
  ce_weight: 0.60
  dice_weight: 0.40

auto_sam:
  coarse_threshold: 0.50
  max_positive_points: 3
  negative_points: 1
  min_component_area: 16
  box_padding_fraction: 0.04
  morphology_kernel: 3
  sam_weight: 0.75

tracking:
  provider: local
  project: aereo-water-four-experiments
  entity: ""
  run_name: full-2841-four-experiments
  wandb_mode: offline
  log_images: 8

inference:
  threshold: 0.50
  use_tiling: true
  tile_size: 1024
  tile_overlap: 128
  min_component_area: 0
  fill_holes: false

export:
  save_masks: true
  save_probability_maps: true
  resume: true
